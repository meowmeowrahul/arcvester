<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>arXiv Hybrid Search</title>
    <!-- Tailwind CSS for instant, beautiful styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./index.js"></script>
    <style>
      /* A little custom CSS to highlight matching terms (optional) */
      .highlight {
        background-color: #fef08a;
        font-weight: 600;
      }
    </style>
  </head>
  <body class="bg-gray-50 min-h-screen font-sans text-gray-800">
    <div class="max-w-4xl mx-auto pt-16 px-4">
      <!-- Header -->
      <div class="text-center mb-8">
        <h1 class="text-4xl font-bold text-blue-600 mb-2">ARCvester</h1>
        <p class="text-gray-500">
          Hybrid Lexical & Semantic Search Engine on
          <a
            href="https://www.kaggle.com/datasets/Cornell-University/arxiv"
            class="text-blue-400 underline italic"
            >arXiv dataset</a
          >
        </p>
      </div>

      <!-- Search Bar -->
      <div
        class="relative flex items-center w-full h-14 rounded-full focus-within:shadow-lg bg-white overflow-hidden border border-gray-300"
      >
        <div class="grid place-items-center h-full w-12 text-gray-300">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
            />
          </svg>
        </div>
        <input
          class="peer h-full w-full outline-none text-lg text-gray-700 pr-2"
          type="text"
          id="search-input"
          placeholder="Search millions of academic papers..."
          onkeypress="handleKeyPress(event)"
        />
        <button
          onclick="clearInput()"
          class="text-lg h-full px-6 text-gray-500 font-semibold hover:text-red-500 transition-colors"
        >
          X
        </button>
        <button
          onclick="performSearch()"
          class="h-full px-6 bg-blue-600 text-white font-semibold hover:bg-blue-700 transition-colors"
        >
          Search
        </button>
      </div>

      <!-- Loading Indicator -->
      <div id="loading" class="hidden mt-8 text-center text-gray-500">
        <p class="animate-pulse">Querying 3 Million+ Documents...</p>
      </div>

      <!-- Results Container -->
      <div id="results-container" class="mt-8 pb-12 space-y-6">
        <!-- Results will be injected here by JavaScript -->
      </div>
    </div>
  </body>
</html>
